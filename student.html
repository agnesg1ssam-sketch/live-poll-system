<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>학생 참여 | Live Poll System</title><style>
*{box-sizing:border-box}
:root{
  --p:#7257dc;--pd:#563db6;--pl:#eee9ff;--bg:#f4f3f8;--tx:#24222a;
  --mu:#74707b;--ln:#dedbe5;--danger:#cf4052;--ok:#16834a;--shadow:0 12px 32px rgba(45,36,79,.09)
}
html{scroll-behavior:smooth}
body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--tx)}
button,input,textarea,select{font:inherit}
a{color:inherit}
.hidden{display:none!important}
.wrap{width:min(1160px,94%);margin:0 auto;padding:28px 0 60px}
.header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}
.header h1{margin:4px 0 0;font-size:clamp(1.5rem,4vw,2.35rem)}
.eyebrow{margin:0;color:var(--p);font-size:.8rem;font-weight:900;letter-spacing:.09em}
.card{background:#fff;border-radius:22px;padding:26px;box-shadow:var(--shadow);margin-bottom:20px}
.card h2{margin-top:0}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:850;cursor:pointer;text-decoration:none;text-align:center;display:inline-block}
.primary{background:var(--p);color:#fff}.primary:hover{background:var(--pd)}
.secondary{background:var(--pl);color:var(--pd)}
.danger{background:#ffe7eb;color:var(--danger)}
.success-btn{background:#e7f7ee;color:var(--ok)}
.full{width:100%;margin-top:16px}
.input,.textarea,.select{width:100%;border:1px solid var(--ln);border-radius:12px;padding:13px 14px;background:#fff;color:var(--tx)}
.input:focus,.textarea:focus,.select:focus{outline:3px solid rgba(114,87,220,.14);border-color:var(--p)}
.textarea{resize:vertical;line-height:1.55}
.label{display:block;font-weight:800;margin:18px 0 8px}
.muted{color:var(--mu)}
.error{color:var(--danger)}
.success{color:var(--ok)}
.badge{background:var(--pl);color:var(--pd);padding:10px 14px;border-radius:999px;font-weight:850;white-space:nowrap}
.message{background:var(--pl);color:var(--pd);border-radius:16px;padding:22px;text-align:center;font-weight:850;line-height:1.7}
.home{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,#e9e2ff,transparent 38%),var(--bg)}
.home-card{width:min(92%,650px);background:#fff;border-radius:25px;padding:54px 38px;text-align:center;box-shadow:var(--shadow)}
.home-card h1{font-size:clamp(2.2rem,7vw,4.1rem);margin:10px 0 14px}
.home-actions{display:grid;gap:12px;margin-top:28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.wide{grid-column:1/-1}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.stat{background:#faf9fc;border:1px solid var(--ln);border-radius:16px;padding:16px}
.stat strong{display:block;font-size:1.45rem;margin-top:5px}
.step-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.step-btn{border:1px solid var(--ln);background:#fff;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}
.step-btn.active{background:var(--p);color:#fff;border-color:var(--p)}
.room-code{font-size:clamp(2rem,7vw,3.7rem);font-weight:950;letter-spacing:.12em;color:var(--pd);margin:10px 0}
.share-box{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:center}
.qr-box{width:220px;min-height:220px;display:grid;place-items:center;background:#fff;border:1px solid var(--ln);padding:10px;border-radius:16px}
.link-row{display:flex;gap:10px;align-items:center}
.link-row .input{flex:1}
.news-title{background:#f0eef5;border-radius:18px;padding:24px;margin:18px 0 24px;font-size:clamp(1.3rem,5vw,2rem);font-weight:900;line-height:1.45}
.vote-grid{display:grid;gap:12px}
.vote-btn{border:2px solid var(--ln);border-radius:16px;background:#fff;padding:18px;text-align:left;font-weight:850;cursor:pointer}
.vote-btn:hover,.vote-btn.selected{border-color:var(--p);background:var(--pl);color:var(--pd)}
.comment-list,.chat-list{display:grid;gap:12px;margin:18px 0 24px}
.comment,.chat-item{background:#f7f6fa;border-left:5px solid var(--p);border-radius:12px;padding:16px;line-height:1.6}
.chat-meta{font-size:.8rem;color:var(--mu);margin-bottom:6px}
.result-head{display:flex;justify-content:space-between;gap:16px;align-items:center}
.result-bars{display:grid;gap:18px;margin-top:22px}
.result-row{display:grid;grid-template-columns:115px 1fr 65px;gap:12px;align-items:center}
.track{height:14px;background:#ece9f2;border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--p);border-radius:999px;transition:width .3s ease}
.value{text-align:right;color:var(--mu)}
table{width:100%;border-collapse:collapse;margin:12px 0 22px}
th,td{padding:12px;border-bottom:1px solid var(--ln);text-align:center}
.report-only{display:none}
@media(max-width:800px){
  .grid{grid-template-columns:1fr}.wide{grid-column:auto}.share-box{grid-template-columns:1fr}.qr-box{margin:auto}
  .status{grid-template-columns:1fr}.step-buttons{grid-template-columns:1fr}.result-head{flex-direction:column;align-items:stretch}
  .link-row{flex-direction:column;align-items:stretch}.header{align-items:flex-start}
}
@media print{
  body{background:#fff}.no-print{display:none!important}.report-only{display:block}.wrap{width:100%;padding:0}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
}
</style></head>
<body><div class="wrap">
<header class="header"><div><p class="eyebrow">학생 참여 화면</p><h1>Live Poll System</h1></div><span id="stepLabel" class="badge">입장</span></header>

<section id="joinCard" class="card">
  <h2>수업에 참여하세요</h2>
  <label class="label">수업 코드</label><input id="roomCodeInput" class="input" maxlength="6" placeholder="예: ABX427">
  <label class="label">별명 또는 번호</label><input id="nickname" class="input" maxlength="15" placeholder="예: 5번 김민지">
  <button id="joinBtn" class="btn primary full">참여하기</button><p id="joinMessage" class="error"></p>
</section>

<section id="activityCard" class="card hidden"><div id="activity"></div></section>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>

const firebaseConfig = {
  apiKey: "AIzaSyCQIL_TXTSQVkyhAWR9XmmWG1gRz_6KBBzU",
  authDomain: "metalk-live.firebaseapp.com",
  databaseURL: "https://metalk-live-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "metalk-live",
  storageBucket: "metalk-live.firebasestorage.app",
  messagingSenderId: "321336664704",
  appId: "1:321336664704:web:191d36e83a08b2f4273c65"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const $=id=>document.getElementById(id);
let roomCode="",nickname="",participantId="",roomData={},roomRef=null;
const urlRoom=new URLSearchParams(location.search).get("room");if(urlRoom)$("roomCodeInput").value=urlRoom.toUpperCase();
const oldName=localStorage.getItem("livePollNickname");if(oldName)$("nickname").value=oldName;

$("joinBtn").onclick=joinRoom;
async function joinRoom(){
  roomCode=$("roomCodeInput").value.trim().toUpperCase();nickname=$("nickname").value.trim();
  if(!roomCode||!nickname){$("joinMessage").textContent="수업 코드와 별명을 모두 입력하세요.";return}
  const snap=await db.ref("rooms/"+roomCode).once("value");if(!snap.exists()){$("joinMessage").textContent="수업방을 찾을 수 없습니다.";return}
  participantId=localStorage.getItem("participant_"+roomCode)||"";
  if(!participantId){participantId=Date.now()+"_"+Math.random().toString(36).slice(2,8);localStorage.setItem("participant_"+roomCode,participantId)}
  localStorage.setItem("livePollNickname",nickname);
  roomRef=db.ref("rooms/"+roomCode);await roomRef.child("participants/"+participantId).set({nickname,joinedAt:Date.now()});
  $("joinCard").classList.add("hidden");$("activityCard").classList.remove("hidden");
  roomRef.on("value",s=>{roomData=s.val()||{};renderStep(roomData.currentStep||0)});
}
function renderStep(step){
  const labels={0:"입장 대기",1:"투표 1",2:"투표 2",3:"투표 3",4:"결과 공개",5:"실시간 의견"};$("stepLabel").textContent=labels[step]||"입장 대기";
  if(step===0)$("activity").innerHTML='<h2>잠시 기다려 주세요</h2><div class="message">선생님이 투표를 시작할 때까지 기다려 주세요.</div>';
  if(step===1)renderVote("vote1",[]);
  if(step===2)renderVote("vote2",roomData.settings?.studentComments||[]);
  if(step===3)renderVote("vote3",roomData.settings?.parentComments||[]);
  if(step===4)renderResults();
  if(step===5)renderChat();
}
function renderVote(round,comments){
  const saved=roomData.votes?.[round]?.[participantId];
  const chtml=comments.length?'<div class="comment-list">'+comments.map(c=>'<div class="comment">'+esc(c)+'</div>').join('')+'</div>':'';
  $("activity").innerHTML=`<p class="eyebrow">${round==="vote1"?"뉴스 제목만 보고 판단해 보세요":"댓글을 읽고 다시 판단해 보세요"}</p><div class="news-title">${esc(roomData.settings?.newsTitle||"뉴스 제목이 입력되지 않았습니다.")}</div>${chtml}<h2>누가 가장 문제일까요?</h2><div class="vote-grid">${["학생","학부모","교사","기타"].map(o=>`<button class="vote-btn ${saved===o?"selected":""}" data-option="${o}" ${saved?"disabled":""}>${o}</button>`).join("")}</div><p class="success">${saved?"투표가 완료되었습니다. 다음 안내를 기다려 주세요.":""}</p>`;
  if(!saved)document.querySelectorAll(".vote-btn").forEach(b=>b.onclick=()=>roomRef.child("votes/"+round+"/"+participantId).set(b.dataset.option));
}
function getPercent(r,o){const v=Object.values(roomData.votes?.[r]||{}),c=v.filter(x=>x===o).length;return v.length?Math.round(c/v.length*1000)/10:0}
function renderResults(){
  const opts=["학생","학부모","교사","기타"],rounds=[["vote1","제목만"],["vote2","학생 비판 댓글"],["vote3","학부모 비판 댓글"]];
  $("activity").innerHTML=`<p class="eyebrow">세 번의 투표 결과</p><h2>우리 반의 판단은 어떻게 달라졌나요?</h2><div style="overflow-x:auto"><table><thead><tr><th>대상</th>${rounds.map(r=>`<th>${r[1]}</th>`).join("")}</tr></thead><tbody>${opts.map(o=>`<tr><th>${o}</th>${rounds.map(r=>`<td>${getPercent(r[0],o)}%</td>`).join("")}</tr>`).join("")}</tbody></table></div><div class="message">뉴스 내용은 달라지지 않았습니다.<br>여러분이 본 댓글만 달라졌습니다.</div>`;
}
function renderChat(){
  const mine=roomData.chat?.[participantId],open=roomData.chatOpen===true,items=Object.entries(roomData.chat||{}).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));
  $("activity").innerHTML=`<p class="eyebrow">실시간 의견 톡</p><h2>왜 생각이 바뀌었나요?</h2><p class="muted">투표 결과를 본 뒤 자신의 생각을 한 문장으로 적어 보세요.</p>${open&&!mine?`<textarea id="chatInput" class="textarea" rows="3" maxlength="120" placeholder="예: 여러 댓글을 보니 사실처럼 느껴졌기 때문입니다."></textarea><button id="chatSend" class="btn primary full">의견 보내기</button>`:`<div class="message">${mine?"의견을 제출했습니다.":"현재 의견 입력이 마감되었습니다."}</div>`}<h3>우리 반 의견</h3><div class="chat-list">${items.length?items.map(([id,m],i)=>`<div class="chat-item"><div class="chat-meta">익명 ${String(i+1).padStart(2,"0")}</div>${esc(m.text)}</div>`).join(""):'<p class="muted">아직 등록된 의견이 없습니다.</p>'}</div>`;
  if(open&&!mine)$("chatSend").onclick=async()=>{const t=$("chatInput").value.trim();if(!t)return alert("의견을 입력하세요.");await roomRef.child("chat/"+participantId).set({nickname,text:t,createdAt:Date.now()})};
}
function esc(t){return String(t).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
</script></body></html>
